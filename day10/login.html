<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - StayEase</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- NAVBAR -->
    <header class="navbar">
      <div class="container nav-content">
        <h1 class="logo"><span>Stay</span>Ease</h1>

        <nav class="nav-links">
          <a href="index.html">Home</a>
          <a href="hotels.html">Hotels</a>
          <a href="contact.html">Contact</a>
        </nav>

        <div class="nav-buttons">
          <a href="login.html" class="btn-outline">Login</a>
          <a href="signup.html" class="btn-primary">Signup</a>
        </div>
      </div>
    </header>

    <section class="section form-section auth-page">
      <div class="container">
        <h2 class="section-title form-title">Welcome Back</h2>

        <form class="form auth-form" action="#" method="POST">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            name="email"
            required
            placeholder="Enter your email"
          />

          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            required
            minlength="6"
            placeholder="Enter your password"
          />

          <button type="submit" class="btn booking-btn">Login</button>

          <p class="auth-switch">
            Don't have an account?
            <a href="signup.html">Sign up</a>
          </p>
        </form>
      </div>
    </section>

    <footer class="footer">
      <p>© 2026 StayEase. All rights reserved.</p>
    </footer>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signup - StayEase</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- NAVBAR -->
<header class="navbar">
  <div class="container nav-content">
    
    <h1 class="logo">
      <span>Stay</span>Ease
    </h1>

    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="hotels.html">Hotels</a>
      <a href="contact.html">Contact</a>
    </nav>

    <div class="nav-buttons">
      <a href="login.html" class="btn-outline">Login</a>
      <a href="signup.html" class="btn-primary">Signup</a>
    </div>

  </div>
</header>


<section class="section form-section auth-page">
  <div class="container">

    <h2 class="section-title form-title">Create Account</h2>

    <form class="form auth-form" id="signupForm" action="#" method="POST">

      <label for="name">Full Name</label>
      <input 
        type="text" 
        id="name" 
        name="fullname"
        required
        pattern="[A-Za-z ]{3,}"
        placeholder="Your full name"
      >

      <label for="email">Email Address</label>
      <input 
        type="email" 
        id="email" 
        name="email"
        required
        placeholder="Enter your email"
      >

      <label for="password">Password</label>
      <input 
        type="password" 
        id="password" 
        name="password"
        required
        minlength="6"
        placeholder="Minimum 6 characters"
      >

      <label for="confirm">Confirm Password</label>
      <input 
        type="password" 
        id="confirm" 
        required
        placeholder="Confirm password"
      >

      <button type="submit" class="btn booking-btn">Signup</button>

      <p class="auth-switch">
        Already have an account?
        <a href="login.html">Login</a>
      </p>

    </form>

  </div>
</section>

<footer class="footer">
  <p>© 2026 StayEase. All rights reserved.</p>
</footer>

<script>
document.getElementById("signupForm").addEventListener("submit", function(e) {
  const password = document.getElementById("password").value;
  const confirm = document.getElementById("confirm").value;

  if (password !== confirm) {
    e.preventDefault();
    alert("Passwords do not match!");
  }
});
</script>

</body>
</html>

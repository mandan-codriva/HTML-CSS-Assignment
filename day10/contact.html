<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="StayEase - Book your dream stay easily" />
    <title>Book Your Stay - StayEase</title>

    <!-- GOOGLE FONT -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- NAVBAR -->
    <header class="navbar">
      <div class="container nav-content">
        <h1 class="logo"><span>Stay</span>Ease</h1>

        <nav class="nav-links">
          <a href="index.html">Home</a>
          <a href="hotels.html">Hotels</a>
          <a href="contact.html" class="active">Contact</a>
        </nav>

        <div class="nav-buttons">
          <a href="login.html" class="btn-outline">Login</a>
          <a href="signup.html" class="btn-primary">Signup</a>
        </div>
      </div>
    </header>

    <!-- BOOKING SECTION -->
    <section class="section form-section">
      <div class="container">
        <h2 class="section-title form-title">Book Your Stay</h2>

        <form class="form booking-form" action="#" method="POST" novalidate>
          <!-- FULL NAME -->
          <label for="name">Full Name</label>
          <input
            type="text"
            id="name"
            name="fullname"
            placeholder="Enter your full name"
            required
            pattern="[A-Za-z ]{3,}"
            title="Name should contain only letters and at least 3 characters"
          />

          <!-- EMAIL -->
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="example@email.com"
            required
          />

          <!-- PHONE -->
          <label for="phone">Phone Number</label>
          <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="Enter 10-digit phone number"
            required
            pattern="[0-9]{10}"
            maxlength="10"
            title="Enter a valid 10-digit phone number"
          />

          <!-- CHECK-IN -->
          <label for="checkin">Check-in Date</label>
          <input type="date" id="checkin" name="checkin" required />

          <!-- CHECK-OUT -->
          <label for="checkout">Check-out Date</label>
          <input type="date" id="checkout" name="checkout" required />

          <!-- ROOM TYPE -->
          <label for="room">Room Type</label>
          <select id="room" name="room" required>
            <option value="">Select Room Type</option>
            <option value="deluxe">Deluxe Room</option>
            <option value="suite">Executive Suite</option>
            <option value="standard">Standard Room</option>
          </select>

          <!-- GENDER -->
          <label>Gender</label>
          <div class="inline options-group">
            <label class="option-card">
              <input type="radio" name="gender" value="male" required />
              <span>Male</span>
            </label>

            <label class="option-card">
              <input type="radio" name="gender" value="female" />
              <span>Female</span>
            </label>
          </div>

          <!-- EXTRAS -->
          <label>Extras</label>
          <div class="inline options-group">
            <label class="option-card">
              <input type="checkbox" name="extras" value="breakfast" />
              <span>Breakfast</span>
            </label>

            <label class="option-card">
              <input type="checkbox" name="extras" value="pool" />
              <span>Pool Access</span>
            </label>
          </div>

          <!-- SPECIAL REQUEST -->
          <label for="message">Special Requests</label>
          <textarea
            id="message"
            name="message"
            rows="4"
            placeholder="Any special requests or preferences..."
          ></textarea>

          <!-- SUBMIT -->
          <button type="submit" class="btn booking-btn">Confirm Booking</button>
        </form>
      </div>
    </section>

    <!-- FOOTER -->
    <footer class="footer">
      <p>© 2026 StayEase. All rights reserved.</p>
    </footer>
  </body>
</html>
